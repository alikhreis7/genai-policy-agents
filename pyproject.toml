[project]
name = "genai-policy-agents"
version = "0.1.0"
description = "Multi-agent GenAI system for enterprise policy lookup and decision support"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Ali Khreis", email = "alikhreis12@gmail.com"}
]
keywords = [
    "genai",
    "agents",
    "multi-agent",
    "rag",
    "llm",
    "langchain",
    "langgraph",
    "policy",
    "enterprise"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/alikhreis7/genai-policy-agents"
Repository = "https://github.com/alikhreis7/genai-policy-agents"
Issues = "https://github.com/alikhreis7/genai-policy-agents/issues"

[project.scripts]
policy-engine = "src.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = "test_*.py"
python_functions = "test_*"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
